[project]
name = "fund"
version = "0.1.0"
description = "Agent-run hedge fund: an Organization of agents that manages a portfolio."
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-harness",
    "alpaca-py>=0.44.0",
    "architectures",
    "exchange-calendars>=4.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Swap these to git sources (`git = "…", subdirectory = "packages/…"`) when fund moves to its own repo.
[tool.uv.sources]
agent-harness = { workspace = true }
architectures = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/fund"]
