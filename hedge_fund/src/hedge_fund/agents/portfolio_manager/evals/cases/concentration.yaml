id: concentration
task: >-
  How concentrated is the book? Show position weights, the top 10 holdings with their combined weight, the Herfindahl
  index and effective number of positions, and the exposure by sector. This is analysis only: do not place, replace,
  cancel or close any orders or positions.
criteria:
  - >-
    Weights are computed in code from the market values of every position fetched in the transcript, and the answer
    states whether the denominator is equity or gross market value.
  - The top-10 table and its combined weight match the computed weights.
  - >-
    The Herfindahl index is the sum of squared weights and the effective number of positions is its reciprocal,
    both computed in code.
  - >-
    Sectors come from data fetched in the transcript (for example FMP company profiles), not from memory; any symbol
    without a sector is listed as unclassified.
  - >-
    Sector weights are aggregated in code from the position weights and the printed sector total agrees with the
    weight total.
  - >-
    The answer starts from the live account state fetched with alpaca-py in the transcript (TradingClient
    constructed with paper=True), not from assumed or remembered holdings.
tags:
  - concentration
  - fmp
