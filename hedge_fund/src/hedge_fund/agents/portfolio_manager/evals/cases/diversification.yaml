id: diversification
task: >-
  Which of my holdings are effectively the same bet? Use one year of daily returns to find the groups that move
  together, show what share of the book each group is, and tell me how diversified the book really is. This is analysis
  only: do not place, replace, cancel or close any orders or positions.
criteria:
  - >-
    Correlations are computed in code from daily returns, not from price levels, over a window of about one year
    fetched in the transcript.
  - >-
    Groups are formed by a stated method (for example hierarchical clustering on 1 minus correlation, or a stated
    correlation threshold), and the same method is applied to every holding.
  - >-
    Each group lists its members, their average pairwise correlation and the group's combined weight, all printed
    in the transcript.
  - >-
    The answer gives at least one book-level diversification measure computed in code (for example average pairwise
    correlation, diversification ratio, or effective number of independent bets from eigenvalues).
  - >-
    Any ETF in the book (for example SPY) is checked against the single stocks it overlaps with, and the answer
    says how that overlap affects the true diversification.
  - >-
    The answer starts from the live account state fetched with alpaca-py in the transcript (TradingClient
    constructed with paper=True), not from assumed or remembered holdings.
tags:
  - correlation
  - market_data
