id: factor_exposure
task: >-
  Estimate the book's exposure to the market, size, value and momentum factors over the past year of daily returns,
  using today's position weights. Tell me which exposures are statistically meaningful. This is analysis only: do
  not place, replace, cancel or close any orders or positions.
criteria:
  - >-
    Factor returns come from a source fetched in the transcript and named in the answer: the Fama-French data library,
    or ETF proxies built from daily bars.
  - >-
    If ETF proxies are used, size, value and momentum are long-short spreads (for example IWM minus SPY, IWD minus
    IWF) rather than raw ETF returns, or the answer explains how overlap with the market factor was handled.
  - >-
    Portfolio daily returns are regressed on the factor returns in code over dates aligned on both sides, and the
    answer states the date range actually covered; any gap between the factor data and today is named.
  - >-
    Each factor loading is reported with a t-statistic, standard error or p-value, plus the regression R-squared,
    all printed in the transcript.
  - >-
    The answer calls an exposure meaningful only when its printed statistic supports it, and states the threshold
    used.
  - >-
    The answer starts from the live account state fetched with alpaca-py in the transcript (TradingClient
    constructed with paper=True), not from assumed or remembered holdings.
tags:
  - factor
  - external_data
