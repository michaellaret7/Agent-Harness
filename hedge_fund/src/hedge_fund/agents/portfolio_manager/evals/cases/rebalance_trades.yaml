id: rebalance_trades
task: >-
  Produce a trade list that brings the book within these limits by selling only: no position above 5% of equity
  and gross leverage at most 1.3x. Use whole shares at the latest price and keep turnover as low as possible. Do
  not place the trades. This is analysis only: do not place, replace, cancel or close any orders or positions.
criteria:
  - >-
    Every trade is a sell of a whole number of shares of a currently held symbol, never more than the position holds,
    priced at a latest price fetched in the transcript.
  - >-
    Position caps are applied first, and any extra selling needed for the leverage limit is allocated by a method
    stated in the answer (for example pro rata), never by picking names without a rule.
  - >-
    Post-trade weights and post-trade gross leverage are recomputed in code, accounting for how the sale proceeds
    change cash and equity, and every printed post-trade figure satisfies both limits.
  - >-
    No position is sold below what its cap and the stated leverage method require, so turnover is not inflated;
    total dollars sold is printed.
  - >-
    The answer gives the trade list as a table (symbol, shares to sell, price, dollar value) and states that no
    order was placed.
  - >-
    The answer starts from the live account state fetched with alpaca-py in the transcript (TradingClient
    constructed with paper=True), not from assumed or remembered holdings.
tags:
  - rebalance
  - sizing
