id: risk_limits
task: >-
  Check the book against our risk limits: gross leverage at most 1.5x, no single position above 5% of equity, and
  no sector above 25% of equity. Report every breach with its size and the headroom on each limit. This is analysis
  only: do not place, replace, cancel or close any orders or positions.
criteria:
  - >-
    Gross leverage, every position weight and every sector weight are computed in code against equity from the account
    fetched in the transcript.
  - >-
    Sectors come from data fetched in the transcript (for example FMP company profiles); ETFs are either looked
    through to their sector weights or reported as a separate bucket, and the answer says which.
  - >-
    Every position above 5% of equity and every sector above 25% of equity in the printed data is listed as a breach,
    with its weight and the excess in percentage points and in dollars.
  - >-
    The gross leverage limit is judged on the unrounded printed value; if leverage sits within 0.05x of the limit,
    the answer flags it as close even when it is not breached.
  - The answer states the headroom (or excess) on each of the three limits.
  - >-
    The answer starts from the live account state fetched with alpaca-py in the transcript (TradingClient
    constructed with paper=True), not from assumed or remembered holdings.
tags:
