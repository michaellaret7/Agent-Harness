[project]
name = "agent-harness-workspace"
version = "0"
description = "uv workspace for the reusable agent harness and optional TUI library."
requires-python = ">=3.12,<3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/agent_harness", "packages/tui", "packages/harness_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "databento>=0.87.0",
    "pytest>=9.1.1",
]
